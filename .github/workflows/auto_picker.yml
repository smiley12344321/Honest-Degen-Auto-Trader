name: Honest Degen Kalshi Auto Picker

on:
  schedule:
    # Run every 15 minutes 24/7 (100% free on public repositories)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in Dry-Run mode (simulation)'
        required: false
        type: boolean
        default: false
      unit_size_override:
        description: 'Optional unit size in dollars override (e.g. 1.00)'
        required: false
        type: string
        default: ''

concurrency:
  group: kalshi-auto-picker-cron
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-picker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Picker
        env:
          KALSHI_ENV: ${{ secrets.KALSHI_ENV || 'prod' }}
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          UNIT_SIZE_DOLLARS: ${{ secrets.UNIT_SIZE_DOLLARS || '0.50' }}
          PRICE_SLIPPAGE_TOLERANCE_CENTS: ${{ secrets.PRICE_SLIPPAGE_TOLERANCE_CENTS || '10' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.unit_size_override }}" ]; then
            ARGS="$ARGS --unit-size ${{ github.event.inputs.unit_size_override }}"
          fi
          python main.py $ARGS

      - name: Commit & push updated trade ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add placed_trades.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update placed trades ledger [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to placed_trades.json"
          fi
